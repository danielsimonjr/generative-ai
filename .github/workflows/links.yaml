name: Links

on:
  repository_dispatch:
  workflow_dispatch:
  schedule:
    - cron: "00 18 * * *"

# Least privilege: this job only reads the tree and reports. It files nothing.
permissions:
  contents: read

jobs:
  linkChecker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Link Checker
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # --root-dir: this repo is full of web sample apps whose HTML uses
          # root-relative hrefs (/vite.svg, /assets/foo.png, /static/style.css).
          # Without a root, lychee cannot resolve them and reports every one as an
          # error -- which is what made this job fail on every scheduled run rather
          # than surfacing an actual broken link.
          #
          # --exclude: Angular templates interpolate filenames ({{icon}}.svg), which
          # url-encode to %7B%7B...%7D%7D. Those are bindings, not links. localhost
          # URLs appear throughout the getting-started docs and cannot resolve in CI
          # by definition.
          args: >-
            --no-progress
            --root-dir "$GITHUB_WORKSPACE"
            --exclude '.*%7B%7B.*'
            --exclude '.*\{\{.*'
            --exclude '^https?://localhost'
            --exclude '^https?://127\.0\.0\.1'
            .
          # Report, do not block. This is a FORK of an upstream samples repo with
          # thousands of files, and what remains after the excludes above is
          # upstream's own link rot -- ~76 missing-file references inside Google's
          # notebooks and gitignored build output. We do not maintain that content,
          # and failing a scheduled job on it means the job is red every day and
          # nobody reads it.
          #
          fail: false

      # ⚠ Reads steps.lychee.outputs.exit_code, NOT env.lychee_exit_code.
      #
      # `fail: false` makes the action set env.lychee_exit_code to 0 even when lychee
      # found errors, so the original condition silently stopped firing: a run with 89
      # broken links reported success AND skipped this step, which is worse than the
      # daily red it replaced -- red at least meant something. The step output carries
      # the real code, so the issue still gets filed.
      # NO issue-filing step. Issues are DISABLED on this fork, so
      # peter-evans/create-issue-from-file can never succeed here -- it failed with
      # "Resource not accessible by integration", and continue-on-error was merely
      # hiding that. A step that cannot work under any circumstance is worse than no
      # step: it reports success while delivering nothing.
      #
      # lychee-action writes its report to the job summary, which is where the link
      # rot is now visible. If issue reports are wanted, enable Issues on the repo and
      # restore the step -- the permissions block above is already in place for it.
      - name: Report
        run: |
          echo "lychee exit code: ${{ steps.lychee.outputs.exit_code }}"
          echo "Full report is in the job summary above."
